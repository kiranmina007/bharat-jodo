<script>
function trackDownload(event, url) {
    event.preventDefault(); // डिफ़ॉल्ट डाउनलोड को रोकें ताकि पिक्सेल कोड रन हो सके

    // फेसबुक पिक्सेल 'Subscribe' इवेंट फायर करें
    fbq('track', 'Subscribe', {
    value: 200,
    currency: 'INR'
});

    // एक वर्चुअल लिंक बनाकर बैकग्राउंड में सुरक्षित तरीके से डाउनलोड शुरू करें
    var link = document.createElement('a');
    link.href = url;
    link.setAttribute('download', '');
    document.body.appendChild(link);
    
    // थोड़ा सा समय (100ms) देकर क्लिक करें ताकि ब्राउज़र पिक्सेल रिक्वेस्ट भेज सके
    setTimeout(function() {
        link.click();
        document.body.removeChild(link);
    }, 100);
}
</script>
